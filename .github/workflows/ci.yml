name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run compile
      - run: npm run test:unit

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # proves the production webpack bundle builds and packs into a vsix
      - run: npx @vscode/vsce package --out manim-sideview.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: manim-sideview.vsix

  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # power users pin old manim versions; the log format the extension
          # parses must hold across all of them
          - manim: "manim==0.17.3"
            python: "3.11"
          - manim: "manim==0.18.1"
            python: "3.11"
          - manim: "manim>=0.19"
            python: "3.12"
          # opengl renderer leg (issue #97): needs a GL context via xvfb/mesa
          - manim: "manim>=0.19"
            python: "3.12"
            opengl: true
    name: contract (${{ matrix.manim }}${{ matrix.opengl && ', opengl' || '' }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      # manimpango has no linux wheels; it builds against pango headers.
      # ffmpeg is needed by manim <= 0.18, which shells out to it (0.19+
      # bundles pyav)
      - run: sudo apt-get update && sudo apt-get install -y libpango1.0-dev pkg-config ffmpeg
      - if: matrix.opengl
        run: sudo apt-get install -y xvfb libgl1 libegl1 libglu1-mesa
      - run: pip install "${{ matrix.manim }}"
      - if: '!matrix.opengl'
        run: npm run test:contract
      - if: matrix.opengl
        run: xvfb-run -a npm run test:contract
        env:
          OPENGL_CONTRACT: "1"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y libpango1.0-dev pkg-config ffmpeg
      - run: pip install "manim>=0.19"
      # the downloaded VSCode build; keyed loosely on the engines range
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-stable
      # ms-python.python is intentionally NOT installed: this exercises the
      # activation path that tolerates a missing python extension. The manim
      # path is absolute, so interpreter resolution is never needed.
      - run: MANIM_BIN=$(which manim) xvfb-run -a npm run test:integration
